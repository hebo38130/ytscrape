name: Storyboard Worker Scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/storyboard_worker_scan.py'
      - '.github/workflows/storyboard-worker-scan.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run storyboard scan
        run: |
          python tools/storyboard_worker_scan.py

      - name: Upload storyboard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-worker-scan
          path: storyboard_output/
          if-no-files-found: warn
