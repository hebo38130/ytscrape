name: Local Worker Transition Research

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/worker_transition_research.py'
      - '.github/workflows/local-worker-transition-research.yml'

jobs:
  research:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install yt-dlp imageio-ffmpeg

      - name: Prepare local ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .bin | Out-Null
          python -c "import imageio_ffmpeg, shutil; shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), r'.bin\\ffmpeg.exe')"
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.bin"
          Write-Host "ffmpeg prepared at $PWD\.bin\ffmpeg.exe"

      - name: Check YouTube access
        shell: pwsh
        run: |
          python -m ytscrape --region US search "construction worker after work truck vlog" --filter videos --max 3 --format json
          yt-dlp --version
          ffmpeg -version | Select-Object -First 1

      - name: Run worker transition research
        shell: pwsh
        run: |
          python tools/worker_transition_research.py

      - name: Upload research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-worker-transition-research
          path: research_output/
          if-no-files-found: warn
